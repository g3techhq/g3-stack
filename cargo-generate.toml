# Makes this repository a template for `dx new`:
#
#   dx new my-app --template gh:g3techhq/g3-stack
#
# `dx new` runs cargo-generate. Each `.liquid` twin replaces its plain file,
# and only those files are rendered, putting the app's own names in. The twins
# are written by `just template` from the plain files, which stay a working
# app. Every other file is copied as it is, which matters for the Rust sources
# and the GitHub workflows, both full of braces Liquid would try to read.

[template]
cargo_generate_version = ">=0.23"
# The twins' paths once `.liquid` is dropped, which is when cargo-generate
# matches them. Written by `just template`.
# BEGIN twins
include = [
  ".env.surrealkit.template",
  ".env.template",
  "Cargo.toml",
  "Dioxus.toml",
  "Dockerfile",
  "compose.yml",
  "docs/mobile.md",
  "docs/troubleshooting.md",
  "package.json",
]
# END twins
# About the template itself, not the app it becomes.
ignore = ["scripts/template.mjs", "scripts/template.test.mjs"]

[placeholders.bundle_id]
type = "string"
prompt = "Bundle identifier for the app stores? Leave empty for com.example.<name>."
default = ""
