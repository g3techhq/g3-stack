# Makes this repository a template for `dx new`:
#
#   dx new my-app --template gh:g3techhq/g3-stack
#
# `dx new` runs cargo-generate. Each `.liquid` twin replaces its plain file,
# and only those files are rendered, putting the app's own names in. The twins
# are written by `just template` from the plain files, which stay a working
# app. Every other file is copied as it is, which matters for the Rust sources
# and the GitHub workflows, both full of braces Liquid would try to read.

[template]
# What the g3 fork's `dx` embeds. The project needs that `dx` to build at all,
# so an older `dx new` stops here instead of generating one it cannot build.
cargo_generate_version = ">=0.25"
# Each twin under both names: cargo-generate matches a file after dropping
# `.liquid`, but 0.23.3 (in `dx` 0.7.9) matched a git template's files before
# (fixed in 0.23.4, cargo-generate#1480). The twin names cost nothing if they
# match nothing. Written by `just template`.
# BEGIN twins
include = [
  ".env.surrealkit.template",
  ".env.surrealkit.template.liquid",
  ".env.template",
  ".env.template.liquid",
  "Cargo.toml",
  "Cargo.toml.liquid",
  "Dioxus.toml",
  "Dioxus.toml.liquid",
  "Dockerfile",
  "Dockerfile.liquid",
  "compose.yml",
  "compose.yml.liquid",
  "docs/mobile.md",
  "docs/mobile.md.liquid",
  "docs/troubleshooting.md",
  "docs/troubleshooting.md.liquid",
  "package.json",
  "package.json.liquid",
]
# END twins
# About the template itself, not the app it becomes.
ignore = ["scripts/template.mjs", "scripts/template.test.mjs"]

[placeholders.bundle_id]
type = "string"
prompt = "Bundle identifier for the app stores? Leave empty for com.example.<name>."
default = ""
