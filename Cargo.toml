[package]
name = "g3-app"
version = "0.1.0"
edition = "2024"
rust-version = "1.89.0"
publish = false
description = "A cross-platform app on the g3 stack: Dioxus, SurrealDB, g3-ui, g3-route-transitions, and g3-native-plugins."

[dependencies]
# --- Core framework -------------------------------------------------------
# Pinned exactly, because the `dx` CLI refuses a build whose `dioxus` version
# does not match its own ("dx and dioxus versions are incompatible"). A caret
# requirement quietly floats to the next alpha and starts warning on a clean
# clone. Until Dioxus 0.8.0 is published these come from the g3 fork (see
# `[patch.crates-io]` at the end), and `dx` must be built from the same fork:
#
#     cargo install --git https://github.com/Gateway3B/dioxus --branch main dioxus-cli --locked
dioxus = { version = "=0.8.0-alpha.3", features = ["router", "fullstack"] }
dioxus-fullstack = "=0.8.0-alpha.3"
# Exact too: each icons alpha is built against one Dioxus alpha.
dioxus-icons = "=0.2.0-alpha.3"
manganis = "=0.8.0-alpha.3"

# --- The g3 libraries -----------------------------------------------------
# The three move together: g3-ui's `transitions` feature and
# g3-route-transitions' `native-back` feature each depend on the matching
# release of the next crate down, so a mismatched minor version pulls in two
# copies and the snapshot classes stop lining up.
g3-ui = { version = "0.7", features = ["transitions"] }
g3-route-transitions = { version = "0.6", features = ["native-back"] }
# Not optional, and not per-platform: the crate compiles a plugin with no
# implementation for the current target down to an inert no-op, so one
# dependency line serves web, Android, iOS, and the server build. Each feature
# is a separate plugin; enable only the ones you call. The full list, and which
# platforms each one works on, is in docs/native-plugins.md.
g3-native-plugins = { version = "0.4.4", features = [
    "back-button",
    "clipboard",
    "external-url",
    "safe-area",
] }
# Sessions, the signed-in user, and a guard that denies by default; see
# src/auth/session.rs. The `server` feature below turns its server side on.
# `record-id` is `g3_auth::RecordId`: SurrealDB's own on the server, and on
# web and mobile a copy with the same wire shape that keeps SurrealDB's `Value`
# (regex, geometry) out of the client, about a megabyte of wasm.
g3-auth = { version = "0.2.0", features = ["record-id"] }
# The screen cache on the device, server caches, and CDN headers for shared
# reads. Enable its platform feature in each app feature below.
g3-cache = "0.3"

# --- Shared (client + server) --------------------------------------------
# `surrealdb-types` carries the `SurrealValue` derive and the `Datetime` type
# used in structs that cross the wire, so it is NOT server-only — the full
# `surrealdb` client below is. Record ids come from g3-auth (above).
surrealdb-types = "=3.2.4"
cfg-if = "1.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
strum = "0.28.0"
strum_macros = "0.28.0"
# Validates the mobile `SERVER_URL` (see `src/server_url.rs`). Already in the
# dependency tree through the database client, so this costs nothing extra.
url = "2.5"

# --- Server only ----------------------------------------------------------
surrealdb = { version = "=3.2.4", optional = true }
surrealkit = { version = "0.6.3", default-features = false, optional = true }
tokio = { version = "1.42", features = ["full"], optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "json", "env-filter"], optional = true }
axum = { version = "0.8.9", optional = true }
axum-macros = { version = "0.5.0", optional = true }
axum_session = { version = "0.20.1", optional = true }
axum_session_auth = { version = "0.20.0", optional = true }
anyhow = { version = "1.0", optional = true }
async-trait = { version = "0.1", optional = true }
dotenvy = { version = "0.15.7", optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"], optional = true }

[target.'cfg(target_os="android")'.dependencies]
jni = "0.21.0"

[features]
default = ["web"]

web = [
    "dioxus/web",
    "g3-cache/web",
]

mobile = [
    "dioxus/mobile",
    "g3-cache/mobile",
    # Keeps the session cookie across launches (Keychain / Keystore).
    "g3-auth/mobile",
    "tokio",
]

server = [
    "dep:tracing",
    "dep:tracing-subscriber",
    "dioxus/server",
    "g3-auth/server",
    "g3-cache/server",
    "surrealdb",
    "surrealkit",
    "tokio",
    "axum",
    "axum-macros",
    "axum_session",
    "axum_session_auth",
    "anyhow",
    "async-trait",
    "dotenvy",
    "rustls",
]

# surrealdb-core is most of the database engine; even the remote client
# depends on it for its wire types. Its debug info runs past a gigabyte and is
# relinked on every server build, and nobody steps through it.
[profile.dev.package.surrealdb-core]
debug = false

[profile.dev.package.surrealdb]
debug = false

[profile.wasm-dev]
inherits = "dev"
opt-level = 1
# Without debug info the dev wasm drops from ~220 MB to ~18 MB, and the
# wasm-bindgen pass dx runs on every rebuild from ~22s to ~2s. Panics and
# stack traces keep their file, line and function names.
debug = 0

[profile.server-dev]
inherits = "dev"
# Line tables keep backtraces readable and cut several seconds off each dx
# server rebuild. Switch to full debug info when attaching a debugger.
debug = "line-tables-only"

[profile.android-dev]
inherits = "dev"
debug = 0
strip = "debuginfo"

# dx builds each platform's release with its own profile (`wasm-release`,
# `server-release`, `android-release`, `ios-release`) and makes one up from
# `release` only when it is not defined here.

# The browser downloads and compiles the whole wasm before the first screen,
# so the web client is built for size. In media-mancer this cut the brotli
# download by a quarter and the wasm to compile by a third; "s" is worth
# measuring against "z".
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
# Client only: the server must keep unwinding, so one failed request does not
# take the process down.
panic = "abort"
debug = false
# dx passes `strip=false` on every build. Saying it here too gives the
# Dockerfile's `cargo chef cook` the same profile, so dx reuses its cache.
strip = false

[profile.server-release]
inherits = "release"
strip = false

# Phones run the UI natively here, so CPU matters more than size.
[profile.android-release]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1

[profile.ios-release]
inherits = "android-release"

# `getrandom` needs an explicit browser backend on wasm, and the dependency
# tree pulls in both major versions — each needs its own opt-in.
[target.wasm32-unknown-unknown.dependencies.getrandom_v03]
package = "getrandom"
version = "0.3.3"
features = ["wasm_js"]

[target.wasm32-unknown-unknown.dependencies.getrandom_v02]
package = "getrandom"
version = "0.2"
features = ["js"]

# Dioxus 0.8 is not on crates.io yet. Until it is, the app builds against the
# g3 fork of Dioxus `main` (upstream main plus the commits listed in the
# fork's G3-PATCHES.md), three ecosystem crates forked to match it, and the g3
# libraries' `main` branches, which have moved to the fork. The requirements
# above stay crates.io versions; these lines only say where those versions
# live until they are published. Delete the block once Dioxus 0.8.0 and the
# matching g3 releases are on crates.io.
#
# Working on a g3 library or the fork itself? Leave these lines alone and put
# a `[patch.crates-io]` table of `path = ".."` entries in a
# `.cargo/config.toml` above your checkouts (see README.md). A config patch
# overrides a manifest patch for the same crate, and Cargo then never fetches
# the git source named here. Keep `Cargo.lock` out of commits while it does:
# it points at your local paths.
[patch.crates-io]
# One line per crate of the Dioxus repository that something in this graph
# asks crates.io for; the rest come from the fork's own workspace.
dioxus = { git = "https://github.com/Gateway3B/dioxus", branch = "main" }
dioxus-fullstack = { git = "https://github.com/Gateway3B/dioxus", branch = "main" }
dioxus-signals = { git = "https://github.com/Gateway3B/dioxus", branch = "main" }
# These two through dioxus-icons, which builds its SVG templates by hand.
dioxus-vdom-template = { git = "https://github.com/Gateway3B/dioxus", branch = "main" }
lazy-js-bundle = { git = "https://github.com/Gateway3B/dioxus", branch = "main" }
manganis = { git = "https://github.com/Gateway3B/dioxus", branch = "main" }
# The published 0.2.0-alpha.3 depends on `dioxus-core-template`, which
# upstream renamed to `dioxus-vdom-template`.
dioxus-icons = { git = "https://github.com/Gateway3B/dioxus-icons", branch = "main" }
# Through g3-ui. The published 0.8.0-alpha.3 still reaches into
# `dioxus::dioxus_core`, which the fork no longer has.
dioxus-sdk-time = { git = "https://github.com/Gateway3B/sdk", branch = "main" }
# g3-auth's mobile cookie jar; the published 0.2 requires Dioxus 0.7.
dioxus-cookie = { git = "https://github.com/Gateway3B/dioxus-cookie", branch = "main" }
# The g3 crates are not published until Dioxus 0.8.0 is.
g3-auth = { git = "https://github.com/g3techhq/g3-auth", branch = "main" }
g3-cache = { git = "https://github.com/g3techhq/g3-cache", branch = "main" }
g3-native-plugins = { git = "https://github.com/g3techhq/g3-native-plugins", branch = "main" }
g3-route-transitions = { git = "https://github.com/g3techhq/g3-route-transitions", branch = "main" }
g3-ui = { git = "https://github.com/g3techhq/g3-ui", branch = "main" }

[lints.clippy]
cloned_instead_of_copied = "warn"
allow_attributes_without_reason = "warn"
