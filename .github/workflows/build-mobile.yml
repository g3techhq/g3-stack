name: Build Mobile Artifacts

run-name: Build ${{ inputs.platform }} mobile artifacts for ${{ inputs.server_url }}

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Native platform to compile
        required: true
        default: both
        type: choice
        options:
          - both
          - android
          - ios
      server_url:
        description: HTTPS backend origin to compile into the app
        required: true
        type: string

concurrency:
  group: build-mobile-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  SERVER_URL: ${{ inputs.server_url }}
  # Shown in Settings → Legal; set them as repository variables. See
  # docs/mobile.md, "Releasing".
  PRIVACY_POLICY_URL: ${{ vars.PRIVACY_POLICY_URL }}
  TERMS_URL: ${{ vars.TERMS_URL }}

jobs:
  android:
    name: Android APK and AAB
    if: inputs.platform == 'both' || inputs.platform == 'android'
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Install web asset dependencies
        run: npm ci

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: mobile-android

      # From the g3 fork the libraries come from: a `dx` built from another
      # commit produces hydration errors. The Cargo cache above keeps the
      # binary, so this only compiles when the fork's main has moved.
      - name: Install Dioxus CLI
        run: cargo install --git https://github.com/Gateway3B/dioxus --branch main dioxus-cli --locked

      - name: Validate compiled configuration
        shell: bash
        run: |
          set -euo pipefail
          : "${SERVER_URL:?Enter the production HTTPS origin when dispatching the workflow}"
          [[ "$SERVER_URL" == https://* ]] || {
            echo "server_url must be an HTTPS origin" >&2
            exit 1
          }

      # Signing is optional: without these secrets the bundles stay unsigned,
      # as before. With them, the upload key signs the AAB for Play App
      # Signing. dx reads the key from `[android.signing]` in Dioxus.toml, as
      # plain values, so the table is added here on the runner and never
      # committed, and the keystore is written outside the checkout.
      - name: Check for an Android upload key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure Android signing
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/upload-keystore.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          # Quoted by jq: JSON's string escapes are also TOML's, so a password
          # may hold quotes or backslashes.
          toml() { jq -n --arg value "$1" '$value'; }
          {
            echo
            echo "[android.signing]"
            echo "jks_file = $(toml "$keystore")"
            echo "jks_password = $(toml "$KEYSTORE_PASSWORD")"
            echo "key_alias = $(toml "$KEY_ALIAS")"
            echo "key_password = $(toml "$KEY_PASSWORD")"
          } >> Dioxus.toml

      # Every store upload needs a higher build number than the last; the run
      # number only ever grows.
      - name: Build Android release bundles
        env:
          DX_ANDROID_VERSION_CODE: ${{ github.run_number }}
          DX_BUNDLE_VERSION: ${{ github.run_number }}
        run: >
          dx bundle --android --release --locked --no-default-features
          --fullstack false --package-types apk --package-types aab
          --out-dir artifacts/android

      - name: Remove the Android upload key
        if: always() && steps.signing.outputs.enabled == 'true'
        run: rm -f "$RUNNER_TEMP/upload-keystore.jks"

      # Only the bundles. The Gradle project dx generates under target/ holds
      # the signing passwords, so it must never be uploaded.
      - name: Upload Android artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ github.event.repository.name }}-android-${{ github.sha }}
          path: artifacts/android/
          if-no-files-found: error
          retention-days: 14

  ios:
    name: iOS IPA
    if: inputs.platform == 'both' || inputs.platform == 'ios'
    # App Store Connect only accepts builds made with the iOS 26 SDK (Xcode 26)
    # since 2026-04-28. macos-15 defaults to Xcode 16, and the SDK is recorded
    # in the bundle, so re-signing an IPA built there cannot fix it.
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Fails here, not at upload, if the image's default Xcode ever moves back.
      - name: Require Xcode 26 or newer
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          major="$(xcodebuild -version | awk 'NR == 1 { split($2, v, "."); print v[1] }')"
          [[ "$major" -ge 26 ]] || {
            echo "App Store uploads need Xcode 26 or newer; this runner selects Xcode $major" >&2
            exit 1
          }

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          targets: aarch64-apple-ios

      - name: Install web asset dependencies
        run: npm ci

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: mobile-ios

      # From the g3 fork the libraries come from: a `dx` built from another
      # commit produces hydration errors. The Cargo cache above keeps the
      # binary, so this only compiles when the fork's main has moved.
      - name: Install Dioxus CLI
        run: cargo install --git https://github.com/Gateway3B/dioxus --branch main dioxus-cli --locked

      - name: Validate compiled configuration
        shell: bash
        run: |
          set -euo pipefail
          : "${SERVER_URL:?Enter the production HTTPS origin when dispatching the workflow}"
          [[ "$SERVER_URL" == https://* ]] || {
            echo "server_url must be an HTTPS origin" >&2
            exit 1
          }

      # Signing is optional: without these secrets the IPA stays unsigned, as
      # before. With them, an Apple Distribution certificate and an App Store
      # provisioning profile go into a throwaway keychain and the profiles
      # folder dx searches, and `--appstore` signs for App Store Connect.
      - name: Check for an App Store signing identity
        id: signing
        env:
          CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          PROFILE_BASE64: ${{ secrets.IOS_APPSTORE_PROFILE_BASE64 }}
        run: |
          if [ -n "$CERTIFICATE_BASE64" ] && [ -n "$PROFILE_BASE64" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install the App Store signing identity
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        env:
          CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_APPSTORE_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          certificate="$RUNNER_TEMP/distribution.p12"
          keychain="$RUNNER_TEMP/app-signing.keychain-db"
          profiles="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          # Never stored anywhere: the keychain only lives for this job.
          keychain_password="$(openssl rand -base64 32)"

          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          rm -f "$certificate"

          mkdir -p "$profiles"
          printf '%s' "$PROFILE_BASE64" | base64 --decode > "$profiles/appstore.mobileprovision"

      # CFBundleVersion must grow with every upload, like Android's versionCode.
      - name: Build iOS release bundle
        shell: bash
        env:
          SIGNED: ${{ steps.signing.outputs.enabled }}
          DX_BUNDLE_VERSION: ${{ github.run_number }}
        run: |
          set -euo pipefail
          if [ "$SIGNED" = true ]; then
            signing=(--appstore)
          else
            signing=(--codesign false)
          fi
          dx bundle --ios --release --locked --no-default-features \
            --fullstack false --package-types ipa "${signing[@]}" \
            --out-dir artifacts/ios

      - name: Remove the App Store signing identity
        if: always() && steps.signing.outputs.enabled == 'true'
        run: |
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true
          rm -f "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/appstore.mobileprovision"

      - name: Upload iOS artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ github.event.repository.name }}-ios-${{ github.sha }}
          path: artifacts/ios/
          if-no-files-found: error
          retention-days: 14
