name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Actions are pinned to a commit rather than a tag. A tag can be moved to point
# at different code; a SHA cannot. Dependabot keeps the pins current.
jobs:
  rust:
    name: Rust (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Every feature set. A bare `cargo check` only covers the web build on the
    # host, so a server-only or mobile-only break would otherwise reach main
    # unnoticed.
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: web
            cargo-args: ""
            test: true
          - target: server
            cargo-args: --no-default-features --features server
            test: true
          - target: mobile
            cargo-args: --no-default-features --features mobile
            test: false

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # rust-toolchain.toml pins the version and the wasm target; the action
      # reads it rather than second-guessing it here.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy, rustfmt

      # `dioxus/mobile` builds wry, which links the system WebView even when
      # the host is only type-checking.
      - name: Install WebView libraries
        if: matrix.target == 'mobile'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ${{ matrix.target }}

      # `asset!()` resolves paths at compile time, and the Tailwind output is
      # generated rather than committed, so it has to exist before anything
      # type-checks. `dx` would build it for real; CI only needs the file.
      - name: Create the generated stylesheet
        run: touch assets/tailwind.css

      - name: Formatting
        if: matrix.target == 'web'
        run: cargo fmt --all -- --check

      - name: Check
        run: cargo check ${{ matrix.cargo-args }}

      # Every feature set, warnings as errors: a lint that only fires in the
      # mobile build is still a lint.
      - name: Clippy
        run: cargo clippy --no-deps ${{ matrix.cargo-args }} ${{ matrix.test && '--all-targets' || '' }} -- -D warnings

      - name: Tests
        if: matrix.test
        run: cargo test ${{ matrix.cargo-args }}

  # This repository is also the `dx new` template. Check that the twins match
  # their plain files, then generate a project the way `dx new` would and
  # type-check it under its new name. Skipped in a generated project, which
  # has no template config.
  template:
    name: Template
    if: hashFiles('cargo-generate.toml') != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          # The whole history, so the git clone below can find this commit.
          fetch-depth: 0

      - name: Template twins are current
        run: node scripts/template.mjs --check

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: template
          workspaces: ${{ runner.temp }}/trail-notes

      # The cargo-generate that `dx` 0.7.9 embeds: 0.23.3, not the newer one the
      # Dioxus repository pins today. They differ in how a git template's
      # `.liquid` files are matched.
      - uses: cargo-bins/cargo-binstall@94dc7fe43d6ed7bfa6a6ea24f60f85e3f41dd104
      - name: Install cargo-generate
        run: cargo binstall --no-confirm cargo-generate@0.23.3

      # From git, as `dx new --template gh:g3techhq/g3-stack` does, rather than
      # from the folder, which cargo-generate reads differently.
      - name: Generate a project
        run: >
          cargo generate --git "file://${{ github.workspace }}" --revision "${{ github.sha }}"
          --name trail-notes --silent
          --destination "${{ runner.temp }}" --define bundle_id=dev.example.trailnotes

      - name: The new name reached every file
        working-directory: ${{ runner.temp }}/trail-notes
        run: |
          grep -q 'name = "trail-notes"' Cargo.toml
          grep -q 'identifier = "dev.example.trailnotes"' Dioxus.toml
          # `if`, not `!`: bash's errexit ignores a negated command, so
          # `! grep ..` could never fail the step. rename.mjs and this workflow
          # name the template on purpose; the lockfiles fix themselves on the
          # first build.
          if grep -rnE --exclude-dir=.git --exclude-dir=.github --exclude-dir=scripts \
            'g3-app($|[^-])|g3_app|g3app' . | grep -v -e '^./Cargo.lock' -e '^./package-lock.json'; then
            echo "The template's own name is left in the files above." && exit 1
          fi
          if ls *.liquid cargo-generate.toml 2> /dev/null; then
            echo "Template files were copied into the project." && exit 1
          fi

      - name: Check the generated project
        working-directory: ${{ runner.temp }}/trail-notes
        run: |
          touch assets/tailwind.css
          cargo check
          cargo check --no-default-features --features server

  web-tooling:
    name: Formatting, scripts, and spelling
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Biome
        run: |
          npm run format:web:check
          npm run lint:web

      - name: Script tests
        run: npm run test:scripts

      - name: Spelling
        uses: crate-ci/typos@d43b6c087ac471e2ea7b8af622ff15f05c0c365b # v1.50.1

      - name: Whitespace
        run: git diff --check

  audit:
    name: Licenses and advisories
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
