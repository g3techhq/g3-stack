[graph]
all-features = false

[advisories]
ignore = [
    { id = "RUSTSEC-2023-0071", reason = "rsa timing side channel, no fix upstream; via surrealdb-core -> jsonwebtoken, not used for decryption here" },
    { id = "RUSTSEC-2021-0141", reason = "dotenv is unmaintained; the server loads .env in development only. Move to dotenvy when convenient" },
    { id = "RUSTSEC-2024-0436", reason = "paste is unmaintained and finished; pulled in by the Dioxus desktop and Surreal dependency trees" },
    { id = "RUSTSEC-2025-0057", reason = "fxhash is unmaintained; pulled in by the Dioxus desktop dependency tree" },
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error is unmaintained; a build-time macro dependency of the Linux desktop GTK stack" },
]

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    # SurrealDB's client and types crates.
    "BUSL-1.1",
    # The Mozilla CA certificate set bundled through webpki-roots.
    "CDLA-Permissive-2.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    # libfuzzer-sys, reached through the image crates (rav1e).
    "NCSA",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8
exceptions = []

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "warn"
highlight = "simplest-path"
workspace-default-features = "allow"
external-default-features = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
