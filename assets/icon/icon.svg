<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- App icon master: full bleed, since every platform applies its own
       mask. The mark stays inside the centre 62%, which keeps it within
       Android's adaptive-icon safe zone. Render the PNG files with
       scripts/app-icon.mjs (npm run icon). -->
  <rect width="1024" height="1024" fill="#2563eb"/>
  <g transform="translate(512 512) scale(6.5882) translate(-64.000 -59.500)">
    <text x="64" y="86" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="64" font-weight="700" fill="#ffffff" text-anchor="middle">g3</text>
  </g>
</svg>
